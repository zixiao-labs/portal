name: Publish portal documents

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.docsignore'
      - '.gitignore'
      - '.github/workflows/publish-docs.yml'
      - '.github/actions/publish-docs/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: portal-docs-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    if: vars.PORTAL_DOCS_ENABLED == 'true' && github.repository_owner == 'zixiao-labs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: docs-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-docs
